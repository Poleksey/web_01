<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Распродажа бытовой химии</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Бытовая химия</h1>
        <button id="cart_button">Корзина (0)</button>
    </header>
    <main>
        <section id="cart_section" class="hidden">
            <h2>Корзина</h2>
            <div id="cart_items_container"></div>
            <p><strong>Итого: <span id="cart_total">0</span> руб.</strong></p>

            <h3>Оформление заказа</h3>
            <form id="order_form">
                <p>
                    <label for="first_name">Имя:</label>
                    <input type="text" id="first_name" name="user_first_name" required>
                </p>
                <p>
                    <label for="last_name">Фамилия:</label>
                    <input type="text" id="last_name" name="user_last_name" required>
                </p>
                <p>
                    <label for="address">Адрес доставки:</label>
                    <input type="text" id="address" name="user_address" required>
                </p>
                <p>
                    <label for="phone">Телефон:</label>
                    <input type="tel" id="phone" name="user_phone" required>
                </p>
                <button type="submit">Создать заказ</button>
            </form>
        </section>
        <section>
            <h2>Каталог</h2>
            <div id="catalog_container">
            </div>
        </section>
    </main>
</body>
</html>
